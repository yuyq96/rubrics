<g font-size="10" letter-spacing="1.5" fill="#5a7395"><text x="62" y="176">DEFINE</text><text x="332" y="176">RESPOND</text><text x="602" y="176">EVALUATE</text><text x="872" y="176">GUIDE</text></g>
<g font-size="19" font-weight="600"><text x="62" y="205">Rubric generator</text><text x="332" y="205">Policy model</text><text x="602" y="205">Reward model</text><text x="872" y="205">Teacher model</text></g>
<g font-size="12" fill="#65748a"><text x="62" y="230">What makes an answer good?</text><text x="332" y="230">Produce candidate responses</text><text x="602" y="230">Execute and verify criteria</text><text x="872" y="230">Provide learning guidance</text></g>
