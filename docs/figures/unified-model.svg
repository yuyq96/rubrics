<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">A common model foundation, multiple learning roles</title><desc id="desc">A shared initialization branches to rubric generator, policy model, reward model and teacher model. Rubrics and responses feed criterion-level feedback; teacher guidance supports the policy. A dashed loop denotes the research vision of joint evolution rather than an established experimental result.</desc>
