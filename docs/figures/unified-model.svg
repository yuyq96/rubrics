<g font-family="Arial,Helvetica,sans-serif" fill="#172337">
<rect x="390" y="18" width="340" height="66" rx="12" fill="#f1f5fc" stroke="#c4d3ea"/><text x="560" y="46" text-anchor="middle" font-size="18" font-weight="600">One model foundation</text><text x="560" y="67" text-anchor="middle" font-size="12" fill="#536782">Shared initialization · role-specific execution</text>
<g fill="none" stroke="#9aaac0" stroke-width="1.4" stroke-dasharray="5 5"><path d="M560 84V110H155V150"/><path d="M560 110H425V150"/><path d="M560 110H695V150"/><path d="M560 110H965V150"/></g>
